name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 18 * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      floci:
        image: floci/floci:2.0.1
        ports:
          - 4566:4566
        env:
          FLOCI_STORAGE_MODE: memory

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build action
        run: pnpm run build

      - name: Configure AWS CLI for Floci
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set default.region us-east-1

      - name: Set AWS Endpoint URL to Floci
        run: echo "AWS_ENDPOINT_URL=http://localhost:4566" >> $GITHUB_ENV

      - name: Execute this action
        uses: ./
        with:
          path_prefix: '/testing/'
          parameters: |
            key1: "value1"
            key2: "value2"

      - name: Execute this action again
        uses: ./
        with:
          path_prefix: '/testing/'
          parameters: |
            key1: "value1_updated"
            key_new3: "value3"
            key4: "@#a&b^c$secret"
            key5: "@#$#%@%@#!"
            key6: "1.100"

      - name: Execute this action with a non-scalar value
        id: bad_value
        continue-on-error: true
        uses: ./
        with:
          path_prefix: '/testing-invalid/'
          parameters: |
            key_bad: [a, b]

      - name: Assert the non-scalar value failed the run
        run: |
          if [ "${{ steps.bad_value.outcome }}" != "failure" ]; then
            echo "Expected a sequence value to fail the sync, got: ${{ steps.bad_value.outcome }}"
            exit 1
          fi

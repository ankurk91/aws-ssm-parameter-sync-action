name: AWS SSM Sync Parameters
description: Sync Parameters to AWS SSM Parameter store

branding:
  icon: repeat
  color: red

inputs:
  path_prefix:
    description: SSM path prefix
    required: true
  parameters:
    description: YAML mapping of parameter names to values
    required: true
  tier:
    description: The parameter tier to assign to a parameter
    default: Standard
  kms_key_id:
    description: KMS key ID/ARN/alias for SecureString encryption
    required: false

runs:
  using: node24
  main: 'dist/index.js'


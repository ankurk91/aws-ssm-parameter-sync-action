name: AWS SSM Sync Parameters
description: Sync parameters to the AWS Systems Manager Parameter Store

branding:
  icon: repeat
  color: red

inputs:
  path_prefix:
    description: SSM path prefix that every parameter is stored under; must start with "/" and contain at least one segment
    required: true
  parameters:
    description: A YAML mapping of parameter names to values; always quote the values
    required: true
  tier:
    description: The parameter tier to assign to every parameter; one of Standard, Advanced or Intelligent-Tiering
    required: false
    default: Standard
  kms_key_id:
    description: The KMS key ID, ARN or alias used to encrypt the SecureString values; defaults to the AWS managed key
    required: false

runs:
  using: node24
  main: 'dist/index.js'
